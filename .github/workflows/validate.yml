name: Validate

# Every pull request and every push to main. Deliberately unfiltered by path:
# a path-filtered job cannot be a required check (a PR touching none of the
# paths never reports, and a required check then blocks it forever).
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write # the preview job posts its URL as a PR comment

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          # The immutability check diffs against the base; the build reads
          # `git log` for per-predicate dates and `git describe` for the revision.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Validate predicates against the definition format
        run: npm run validate

      - name: Immutability of published terms
        env:
          # On a PR, compare with the branch it targets. On a push to main,
          # compare with the commit before it.
          BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || 'HEAD~1' }}
        run: npm run check:immutability

      - name: No instance-specific value outside registry.config.json
        run: npm run check:instance

      - name: Unit tests (validator fixtures, worker routing)
        run: npm test

      - name: Build
        run: npm run build

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 3

  # A preview deployment per pull request, so a reviewer sees the rendered
  # page of a proposed predicate before merging. Only for branches in this
  # repository: a fork's PR cannot read the secrets and is validated only.
  preview:
    needs: validate
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Deploy preview to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy --branch "${{ github.head_ref }}" --commit-hash ${{ github.event.pull_request.head.sha }} --commit-dirty=true
      - name: Verify the preview
        run: node infra/verify.mjs "${{ steps.deploy.outputs.deployment-url }}"
      - name: Post the preview URL
        env:
          GH_TOKEN: ${{ github.token }}
          URL: ${{ steps.deploy.outputs.deployment-url }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          body="Preview deployment for $(git rev-parse --short "${{ github.event.pull_request.head.sha }}"): ${URL}"
          # One comment per PR, updated in place.
          existing="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" --jq '.[] | select(.body | startswith("Preview deployment for")) | .id' | head -1)"
          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${existing}" -f body="$body" >/dev/null
          else
            gh pr comment "$PR" --body "$body"
          fi

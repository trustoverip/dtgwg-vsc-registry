name: Deploy

# Every push to main publishes the registry (PLAN.md §2.4). The build job is
# the same build validate.yml already ran on the PR; the deploy job uploads
# its output to Cloudflare Pages and verifies the live result.
#
# Requires two repository secrets: CLOUDFLARE_API_TOKEN (a token with
# "Cloudflare Pages: Edit" on the account) and CLOUDFLARE_ACCOUNT_ID. The
# Pages project name is `name` in wrangler.toml.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Two merges in quick succession deploy in order, never interleaved.
concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # release.json records the commit and the nearest tag
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Referencing an environment lets the repository require a reviewer for
    # deploys later, if the task force wants that gate; it needs no setup now.
    environment: production
    steps:
      - uses: actions/checkout@v6 # for wrangler.toml, registry.config.json and infra/verify.mjs
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy --branch main --commit-hash ${{ github.sha }} --commit-dirty=true

      - name: Verify the deployment
        run: node infra/verify.mjs "${{ steps.deploy.outputs.deployment-url }}" --expect-commit "${{ github.sha }}"

      - name: Verify the production host
        # Until the custom domain resolves this fails; it becomes required
        # once the CNAME is live (PLAN.md §2.7 step 3).
        continue-on-error: true
        run: node infra/verify.mjs "$(node -p "require('./registry.config.json').siteUrl")" --expect-commit "${{ github.sha }}"

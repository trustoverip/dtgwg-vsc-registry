version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Tooling only. A dependency bump never touches predicates/ and never
    # needs the two-editor review that a predicate change does.
    groups:
      tooling:
        patterns: ["*"]
